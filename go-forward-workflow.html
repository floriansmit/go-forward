  text-align: center;

  border-color: var(--input);
  border-radius: var(--radius-sm);

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;go-forward-workflow&quot;&gt;
  &lt;style&gt;
    #go-forward-workflow { color: var(--foreground); font-size: var(--font-size-base); width: min(96vw, 1800px); margin: 0 auto; }
    #go-forward-workflow .overview { display: grid; grid-template-columns: minmax(150px, .8fr) repeat(4, minmax(210px, 1fr)); gap: 16px; align-items: stretch; }
    #go-forward-workflow .source, #go-forward-workflow .approach { min-width: 0; }
    #go-forward-workflow .source { display:flex; align-items:center; font-weight:500; padding:12px 0; }
    #go-forward-workflow .approach { display:grid; grid-template-rows:auto 1fr; gap:8px; }
    #go-forward-workflow .approach button { text-align:left; width:100%; min-height:70px; }
    #go-forward-workflow .approach button strong { display:block; font-weight:500; }
    #go-forward-workflow .approach button span { display:block; margin-top:4px; }
    #go-forward-workflow .flow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    #go-forward-workflow .step { padding:5px 7px; background:color-mix(in srgb, var(--muted) 55%, transparent); border-radius:4px; font-size:0.9em; }
    #go-forward-workflow .arrow { color:var(--muted-foreground); }
    #go-forward-workflow .detail { margin-top:18px; }
    #go-forward-workflow .detail-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px; }
    #go-forward-workflow .detail h2 { margin:0; }
    #go-forward-workflow .diagram { display:grid; grid-template-columns:repeat(4, minmax(220px, 1fr)); gap:14px; align-items:stretch; }
    #go-forward-workflow .diagram .stage { display:flex; flex-direction:column; justify-content:center; min-height:92px; padding:11px; background:color-mix(in srgb, var(--accent) 45%, transparent); border-radius:6px; }
    #go-forward-workflow .diagram .stage strong { font-weight:500; }
    #go-forward-workflow .diagram .stage span { margin-top:5px; color:var(--muted-foreground); font-size:.9em; }
    #go-forward-workflow .diagram .stage code { display:block; margin-top:9px; overflow-wrap:anywhere; }
    #go-forward-workflow .diagram .stage.output { background:color-mix(in srgb, var(--secondary) 65%, transparent); }
    #go-forward-workflow .route { margin:9px 0 0; color:var(--muted-foreground); }
    #go-forward-workflow .note { margin:10px 0 0; color:var(--muted-foreground); }
    @media (max-width: 1100px) { #go-forward-workflow .overview { grid-template-columns:1fr 1fr; } #go-forward-workflow .source { grid-column:1/-1; } #go-forward-workflow .diagram { grid-template-columns:1fr 1fr; } }
    @media (max-width: 420px) { #go-forward-workflow .overview, #go-forward-workflow .diagram { grid-template-columns:1fr; } }
  &lt;/style&gt;
  &lt;section aria-label=&quot;GO-Forward approaches overview&quot;&gt;
    &lt;div class=&quot;overview&quot;&gt;
      &lt;div class=&quot;source&quot;&gt;Five DionisosFlow&lt;br&gt;GRDECL realizations&lt;/div&gt;
      &lt;div class=&quot;approach&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-key=&quot;best&quot; aria-pressed=&quot;true&quot;&gt;&lt;strong&gt;Best-fit&lt;/strong&gt;&lt;span class=&quot;text-muted text-small&quot;&gt;Separate run for every realization&lt;/span&gt;&lt;/button&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;step&quot;&gt;5 point sets&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;T&amp;gt;Map ×5&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;approach&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-key=&quot;union&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Multi-realization: Union&lt;/strong&gt;&lt;span class=&quot;text-muted text-small&quot;&gt;All actual cells, grouped by facies&lt;/span&gt;&lt;/button&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;step&quot;&gt;facies unions&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;direct lookup&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;approach&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-key=&quot;control&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Multi-realization: Control&lt;/strong&gt;&lt;span class=&quot;text-muted text-small&quot;&gt;Reduced actual cells, grouped by facies&lt;/span&gt;&lt;/button&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;step&quot;&gt;control points&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;vertical interpolation&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;approach&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-key=&quot;uber&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Multi-realization: Uber&lt;/strong&gt;&lt;span class=&quot;text-muted text-small&quot;&gt;Reusable regular lookup grid by facies&lt;/span&gt;&lt;/button&gt;
        &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;step&quot;&gt;regular lookup grid&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;future-model reuse&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;detail&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;detail-head&quot;&gt;&lt;h2 id=&quot;title&quot;&gt;Best-fit&lt;/h2&gt;&lt;span class=&quot;text-muted&quot; id=&quot;focus&quot;&gt;Maximum realization specificity&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;diagram&quot; id=&quot;diagram&quot; role=&quot;img&quot; aria-label=&quot;Best-fit workflow&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;route&quot; id=&quot;route&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;note&quot; id=&quot;note&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;go-forward-workflow&#x27;);
      const data = {
        best: { title:&#x27;Best-fit&#x27;, focus:&#x27;Maximum realization specificity&#x27;, stages:[[&#x27;Source GRDECLs&#x27;,&#x27;Each realization is kept separate&#x27;,&#x27;for grdecl in source_grdecls&#x27;],[&#x27;Cell-centre point sets&#x27;,&#x27;Export every grid cell for each realization&#x27;,&#x27;grdecl_to_petrel_pointsets.py&#x27;],[&#x27;T&gt;Map&#x27;,&#x27;Run independently for each realization&#x27;,&#x27;generate_tmap_pointsets.py&#x27;],[&#x27;Augmented GRDECLs&#x27;,&#x27;Properties return to the same realization&#x27;,&#x27;pointsets_to_augmented_grdecl.py&#x27;]], route:&#x27;5 realization-specific point sets → 5 T&gt;Map runs → 5 matching GRDECL outputs.&#x27;, note:&#x27;Best when each realization should retain its own direct T&gt;Map calculation.&#x27; },
        union: { title:&#x27;Multi-realization: Union&#x27;, focus:&#x27;Direct mapping of every actual cell&#x27;, stages:[[&#x27;All source GRDECLs&#x27;,&#x27;Collect cells across all realizations&#x27;,&#x27;read all cells + facies&#x27;],[&#x27;Union point sets by facies&#x27;,&#x27;All actual occurrences; IDs retain realization + cell&#x27;,&#x27;groupby(Facies)&#x27;],[&#x27;T&gt;Map by facies&#x27;,&#x27;Run on the complete actual-cell union&#x27;,&#x27;generate_tmap_pointsets.py&#x27;],[&#x27;Augmented GRDECLs&#x27;,&#x27;Direct lookup by Realization and CellIndex&#x27;,&#x27;lookup[Realization][CellIndex]&#x27;]], route:&#x27;Actual cells are grouped by facies once; no approximation is introduced during append-back.&#x27;, note:&#x27;Use when the full multi-realization population can be submitted to T&gt;Map and exact cell-level mapping is required.&#x27; },
        control: { title:&#x27;Multi-realization: Control&#x27;, focus:&#x27;Fewer T&gt;Map simulations&#x27;, stages:[[&#x27;All source GRDECLs&#x27;,&#x27;Inspect actual cells by realization, XY column, and facies&#x27;,&#x27;groupby(R, X, Y, Facies)&#x27;],[&#x27;Control point sets by facies&#x27;,&#x27;Keep top, bottom, plus ≤50 m vertical spacing controls&#x27;,&#x27;select(z_top, z_bottom, Δz ≤ 50 m)&#x27;],[&#x27;T&gt;Map on controls&#x27;,&#x27;Run only the selected actual cells&#x27;,&#x27;generate_tmap_pointsets.py&#x27;],[&#x27;Augmented GRDECLs&#x27;,&#x27;Interpolate vertically within realization + XY + facies&#x27;,&#x27;interpolate(z_control → z_cell)&#x27;]], route:&#x27;Reduced controls → T&gt;Map → vertical interpolation for skipped cells.&#x27;, note:&#x27;Use when reducing simulation volume matters and vertical interpolation within each facies column is acceptable.&#x27; },
        uber: { title:&#x27;Multi-realization: Uber&#x27;, focus:&#x27;Reusable across facies models&#x27;, stages:[[&#x27;Grid geometry&#x27;,&#x27;Use all GRDECL XY columns&#x27;,&#x27;XY = all grid columns&#x27;],[&#x27;Uber point sets by facies&#x27;,&#x27;Regular 25 m Z sampling; one facies per file&#x27;,&#x27;for facies: mesh(XY, z=25 m)&#x27;],[&#x27;T&gt;Map lookup library&#x27;,&#x27;Run on fixed facies-specific lookup grids&#x27;,&#x27;generate_tmap_pointsets.py&#x27;],[&#x27;Augmented GRDECLs&#x27;,&#x27;Match XY + facies, then interpolate to cell-centre Z&#x27;,&#x27;lookup(XY, Facies); interpolate(Z)&#x27;]], route:&#x27;Fixed facies lookup grids → T&gt;Map → reuse for current or future facies realizations.&#x27;, note:&#x27;Use when building a reusable property library. Current setup uses 9 non-zero facies; facies-0 cells can be missing unless included.&#x27; }
      };
      const diagram = root.querySelector(&#x27;#diagram&#x27;);
      function render(key) {
        const item = data[key];
        root.querySelector(&#x27;#title&#x27;).textContent = item.title;
        root.querySelector(&#x27;#focus&#x27;).textContent = item.focus;
        root.querySelector(&#x27;#route&#x27;).textContent = item.route;
        root.querySelector(&#x27;#note&#x27;).textContent = item.note;
        diagram.innerHTML = item.stages.map((s, i) =&gt; `&lt;div class=&quot;stage ${i === 3 ? &#x27;output&#x27; : &#x27;&#x27;}&quot;&gt;&lt;strong&gt;${s[0]}&lt;/strong&gt;&lt;span&gt;${s[1]}&lt;/span&gt;&lt;code&gt;${s[2]}&lt;/code&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        diagram.setAttribute(&#x27;aria-label&#x27;, item.title + &#x27; workflow&#x27;);
        root.querySelectorAll(&#x27;[data-key]&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.key === key)));
      }
      root.querySelectorAll(&#x27;[data-key]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.key)));
      render(&#x27;best&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
