name: Windows portable dashboard

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv pip install 'pyinstaller>=6.16,<7'
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync python -m PyInstaller --noconfirm packaging/go_forward.spec
      - run: uv run --no-sync python packaging/smoke_test.py
      - shell: pwsh
        run: |
          Compress-Archive -Path dist/GO-Forward -DestinationPath dist/GO-Forward-Windows-x64.zip
          Get-FileHash dist/GO-Forward-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GO-Forward-Windows-x64
          path: |
            dist/GO-Forward-Windows-x64.zip
            dist/SHA256.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GO-Forward-Windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
